<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Encontro VIP</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f1f8;
color: #222;
}

.container {
max-width: 700px;
margin: auto;
padding: 20px;
}

h1 {
color: #6a1b9a;
text-align: center;
}

h2 {
color: #6a1b9a;
}

.card {
background: white;
padding: 20px;
margin-top: 20px;
border-radius: 15px;
box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

input,
textarea {
width: 100%;
padding: 12px;
margin: 7px 0 12px;
border: 1px solid #ccc;
border-radius: 8px;
font-size: 16px;
}

textarea {
min-height: 100px;
resize: vertical;
}

button {
border: none;
border-radius: 8px;
padding: 12px 18px;
margin: 5px 3px;
font-size: 15px;
cursor: pointer;
}

button:disabled {
opacity: 0.6;
cursor: not-allowed;
}

.btn-principal {
background: #6a1b9a;
color: white;
}

.btn-verde {
background: #198754;
color: white;
}

.btn-roxo {
background: #8e44ad;
color: white;
}

.btn-secundario {
background: #ddd;
color: #222;
}

.btn-perigo {
background: #dc3545;
color: white;
}

.hidden {
display: none !important;
}

.centro {
text-align: center;
}

.sucesso {
color: #198754;
font-weight: bold;
margin-top: 10px;
}

.erro {
color: #dc3545;
font-weight: bold;
margin-top: 10px;
}

.anuncio {
background: #fff;
border: 1px solid #ddd;
border-radius: 12px;
padding: 15px;
margin: 12px 0;
}

.anuncio img {
width: 100%;
max-height: 350px;
object-fit: cover;
border-radius: 10px;
margin-bottom: 10px;
}

.conversa {
background: #fff;
border: 1px solid #ddd;
border-radius: 10px;
padding: 15px;
margin: 10px 0;
}

.chat {
height: 400px;
overflow-y: auto;
background: #f1f1f1;
padding: 12px;
border-radius: 10px;
margin-bottom: 12px;
}

.balao {
padding: 10px;
border-radius: 12px;
margin: 8px 0;
max-width: 80%;
word-wrap: break-word;
}

.balao-enviado {
background: #d9b3ff;
margin-left: auto;
text-align: right;
}

.balao-recebido {
background: white;
margin-right: auto;
}

.data-msg {
display: block;
font-size: 11px;
color: #777;
margin-top: 5px;
}

.pequeno {
font-size: 12px;
color: #777;
}

.sem-mensagem {
text-align: center;
padding: 30px;
color: #777;
}

.aviso {
background: #fff3cd;
border: 1px solid #ffe69c;
padding: 12px;
border-radius: 8px;
font-size: 14px;
margin: 15px 0;
}

</style>

</head>

<body>

<div class="container">

<!-- INÍCIO -->

<div id="inicio">

<div class="card centro">

<h1>Encontro VIP</h1>

<p>
Conecte-se de forma simples e segura.
</p>

<div class="aviso">

<strong>18+:</strong>
Este site é destinado exclusivamente
a pessoas maiores de 18 anos.

</div>

<button
class="btn-principal"
onclick="mostrar('cadastro')"

>

Criar conta </button>

<button
class="btn-secundario"
onclick="mostrar('login')"

>

Entrar </button>

</div>

</div>

<!-- CADASTRO -->

<div id="cadastro" class="hidden">

<div class="card">

<h2>Criar conta</h2>

<input
id="cadNome"
type="text"
placeholder="Nome"

>

<input
id="cadTelefone"
type="text"
placeholder="Telefone"

>

<input
id="cadEmail"
type="email"
placeholder="E-mail"

>

<input
id="cadSenha"
type="password"
placeholder="Senha"

>

<button
class="btn-principal"
onclick="cadastrar()"

>

Criar minha conta </button>

<button
class="btn-secundario"
onclick="mostrar('inicio')"

>

Voltar </button>

<p id="cadMensagem"></p>

</div>

</div>

<!-- LOGIN -->

<div id="login" class="hidden">

<div class="card">

<h2>Entrar</h2>

<input
id="loginEmail"
type="email"
placeholder="E-mail"

>

<input
id="loginSenha"
type="password"
placeholder="Senha"

>

<button
class="btn-principal"
onclick="entrar()"

>

Entrar </button>

<button
class="btn-secundario"
onclick="mostrar('inicio')"

>

Voltar </button>

<p id="loginMensagem"></p>

</div>

</div>

<!-- PAINEL -->

<div id="painel" class="hidden">

<div class="card">

<h2 id="olaUsuario">
Olá!
</h2>

<button
class="btn-principal"
onclick="mostrar('criarAnuncio')"

>

Criar meu anúncio </button>

<button
class="btn-roxo"
onclick="listarAnuncios()"

>

Ver anúncios </button>

<button
class="btn-roxo"
onclick="listarFavoritos()"

>

Meus favoritos </button>

<button
class="btn-roxo"
onclick="listarConversas()"

>

Minhas mensagens </button>

<button
class="btn-perigo"
onclick="sair()"

>

Sair </button>

</div>

</div>

<div class="card">

<h
