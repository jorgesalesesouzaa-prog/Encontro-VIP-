/* =========================
   ESCAPAR HTML
========================= */

function escapeHtml(valor) {

  if (valor === null || valor === undefined) {
    return "";
  }

  return String(valor)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   MOSTRAR TELA

function mostrar(tela) {

  const telas = [
    "inicio",
    "cadastro",
    "login",
    "painel",
    "criarAnuncio",
    "listaAnuncios",
    "listaFavoritos",
    "listaConversas",
    "chatTela"
  ];

  telas.forEach(id => {

    const elemento =
      document.getElementById(id);

    if (elemento) {
      elemento.classList.add("hidden");
    }

  });

  const escolhida =
    document.getElementById(tela);

  if (escolhida) {
    escolhida.classList.remove("hidden");
  }


  if (tela !== "chatTela") {

    pararAtualizacaoChat();

  }
}


/* =========================
   CADASTRO
========================= */

async function cadastrar() {

  const nome =
    document.getElementById("cadNome")
      .value.trim();

  const telefone =
    document.getElementById("cadTelefone")
      .value.trim();

  const email =
    document.getElementById("cadEmail")
      .value.trim();

  const senha =
    document.getElementById("cadSenha")
      .value;

  const mensagem =
    document.getElementById("cadMensagem");

  mensagem.textContent = "";

  if (!nome || !email || !senha) {

    mensagem.textContent =
      "Preencha nome, e-mail e senha.";

    mensagem.className = "erro";

    return;
  }

  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password: senha
    });

  if (error) {

    mensagem.textContent =
      error.message;

    mensagem.className = "erro";

    return;
  }

  if (!data.user) {

    mensagem.textContent =
      "Conta criada. Verifique seu e-mail.";

    mensagem.className = "sucesso";

    return;
  }

  const { error: erroPerfil } =
    await supabaseClient
      .from("profiles")
      .insert({
        id: data.user.id,
        nome: nome,
        telefone: telefone,
        tipo: "usuario",
        ativo: true
      });

  if (erroPerfil) {

    mensagem.textContent =
      "Conta criada, mas houve problema ao salvar o perfil: " +
      erroPerfil.message;

    mensagem.className = "erro";

    return;
  }

  mensagem.textContent =
    "Cadastro criado com sucesso!";

  mensagem.className = "sucesso";

  setTimeout(() => {
    mostrar("login");
  }, 1000);
}

async function entrar() {

      .value.trim();

      .value;

    await supabaseClient.auth.signInWithPassword({

    mensagem.className = "erro";

  usuario = data.user;

}

async function carregarPainel() {

  const { data: perfil } =

      .from("profiles")
      .select("nome")

    nome = perfil.nome;

  document.getElementById("olaUsuario")

  mostrar("painel");

      .value.trim();

    document.getElementById("anIdade")

      .value.trim();

  const foto =
    document.getElementById("anFoto")

  const mensagem =
    document.getElementById("anMensagem");

  if (!nome || !idade || !cidade || !descricao) {

    mensagem.textContent =
      "Preencha todos os campos obrigatórios.";

    mensagem.className = "erro";

    return;
  }

  const { error } =
    await supabaseClient
      .from("anuncios")
      .insert({
        usuario_id: usuario.id,
        nome: nome,
        idade: Number(idade),
        cidade: cidade,
        descricao: descricao,
        foto_url: foto || null,
        ativo: true
      });

  if (error) {

    mensagem.textContent =
      error.message;

    mensagem.className = "erro";

    return;
  }

  mensagem.textContent =
    "Anúncio publicado com sucesso!";

  document.getElementById("anNome").value = "";
  document.getElementById("anIdade").value = "";
  document.getElementById("anCidade").value = "";
  document.getElementById("anDescricao").value = "";
  document.getElementById("anFoto").value = "";
}

async function listarAnuncios() {

  mostrar("listaAnuncios");

    document.getElementById("conteudoAnuncios");

  conteudo.innerHTML =

  }

  if (!data || data.length === 0) {

    conteudo.innerHTML =

  }

  conteudo.innerHTML = "";

  data.forEach(anuncio => {

      fotoHtml = `

    div.innerHTML = `

async function abrirConversa(id, nome) {

  if (!usuario) {

    alert("Faça login primeiro.");

    return;
  }

  if (id === usuario.id) {

    alert(
      "Você não pode conversar com você mesmo."
    );

    return;
  }

  conversaUsuarioId = id;

  const { data: perfil, error } =
    await supabaseClient
      .from("profiles")
      .select("nome")
      .eq("id", id)
      .maybeSingle();

  if (!error && perfil && perfil.nome) {

    conversaUsuarioNome =
      perfil.nome;

  } else {

    conversaUsuarioNome =
      nome || "Usuário";
  }

  await carregarChat();
}

async function listarConversas() {

  pararAtualizacaoChat();

  mostrar("listaConversas");

  const conteudo =
    document.getElementById("conteudoConversas");

  conteudo.innerHTML =
    "<p>Carregando conversas...</p>";

  if (!usuario) {
    conteudo.innerHTML =
      "<p class='erro'>Faça login primeiro.</p>";
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("mensagens")
      .select(`
        id,
        remetente_id,
        destinatario_id,
        mensagem,
        lida,
        created_at
      `)
      .or(
        `remetente_id.eq.${usuario.id},destinatario_id.eq.${usuario.id}`
      )
      .order("created_at", {
        ascending: false
      });

  if (error) {

    conteudo.innerHTML =
      `<p class="erro">${escapeHtml(error.message)}</p>`;

    return;
  }

  if (!data || data.length === 0) {

    conteudo.innerHTML =
      `<div class="sem-mensagem">
        Você ainda não possui mensagens.
      </div>`;

    return;
  }

  const usuariosConversas =
    new Map();

  data.forEach(msg => {

    const outroUsuario =
      msg.remetente_id === usuario.id
        ? msg.destinatario_id
        : msg.remetente_id;

    if (!usuariosConversas.has(outroUsuario)) {

      usuariosConversas.set(
        outroUsuario,
        msg
      );
    }
  });

  const ids =
    Array.from(usuariosConversas.keys());

  const { data: perfis } =
    await supabaseClient
      .from("profiles")
      .select("id, nome")
      .in("id", ids);

  const nomes = {};

  if (perfis) {

    perfis.forEach(perfil => {

      nomes[perfil.id] =
        perfil.nome;

    });
  }

  conteudo.innerHTML = "";

  usuariosConversas.forEach(
    (ultimaMensagem, outroId) => {

      const div =
        document.createElement("div");

      div.className = "conversa";

      const nome =
        nomes[outroId] ||
        "Usuário";

      const texto =
        ultimaMensagem.mensagem;

      const dataMensagem =
        new Date(
          ultimaMensagem.created_at
        ).toLocaleString("pt-BR");

      div.innerHTML = `
        <strong>
          ${escapeHtml(nome)}
        </strong>

        <p>
          ${escapeHtml(texto)}
        </p>

        <span class="pequeno">
          ${dataMensagem}
        </span>

        <button class="btn-roxo">
          Abrir conversa
        </button>
      `;

      div.querySelector("button")
        .addEventListener("click", () => {

          abrirConversa(
            outroId,
            nome
          );

        });

      conteudo.appendChild(div);
    }
  );
}

  esconderTudo();

  const elemento =
    document.getElementById(id);

  if (elemento) {
    elemento.classList.remove("hidden");
  }
}

function mostrarTela(id) {

  document
    .querySelectorAll("#painel > div")
    .forEach(div => {
      div.classList.add("hidden");
    });

  document
    .getElementById(id)
    .classList.remove("hidden");

  document
    .getElementById("painel")
    .classList.remove("hidden");
}

function voltarPainel() {

  document
    .querySelectorAll("#painel > div")
    .forEach(div => {
      div.classList.add("hidden");
    });

  document
    .getElementById("painel")
    .classList.remove("hidden");
}

/* SEGURANÇA */

function escapeHtml(texto) {

  if (texto === null || texto === undefined) {
    return "";
  }

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
  }

  /* ABRIR CONVERSA */

async function abrirConversa(outroUsuarioId) {

  if (outroUsuarioId === usuario.id) {
    alert("Você não pode conversar com você mesmo.");
    return;
  }

  conversaUsuarioId = outroUsuarioId;

  mostrarTela("chatTela");

  await carregarChat();

  iniciarAtualizacaoChat();
}


/* CARREGAR CHAT */

async function carregarChat() {

  const titulo =
    document.getElementById("chatTitulo");

  const { data } =
    await supabaseClient
      .from("profiles")
      .select("nome")
      .eq("id", conversaUsuarioId)
      .maybeSingle();

  titulo.innerText =
    `Chat com ${data?.nome || "usuário"}`;

  await buscarMensagensChat();
}


/* BUSCAR MENSAGENS */

async function buscarMensagensChat() {

  if (!conversaUsuarioId || !usuario) {
    return;
  }

  const conteudo =
    document.getElementById("chatConteudo");

  const { data, error } =
    await supabaseClient
      .from("mensagens")
      .select("*")
      .or(
        `and(remetente_id.eq.${usuario.id},destinatario_id.eq.${conversaUsuarioId}),and(remetente_id.eq.${conversaUsuarioId},destinatario_id.eq.${usuario.id})`
      )
      .order("created_at", {
        ascending: true
      });

  if (error) {

    conteudo.innerHTML = `
      <div class="erro">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }

  conteudo.innerHTML = "";

  if (!data || data.length === 0) {

    conteudo.innerHTML = `
      <div class="sem-mensagem">
        Nenhuma mensagem ainda.
      </div>
    `;

    return;
  }

  data.forEach(msg => {

    const balao =
      document.createElement("div");

    balao.classList.add("balao");

    if (msg.remetente_id === usuario.id) {

      balao.classList.add(
        "balao-enviado"
      );

    } else {

      balao.classList.add(
        "balao-recebido"
      );
    }

    balao.innerText =
      msg.mensagem;

    conteudo.appendChild(balao);
  });

  conteudo.scrollTop =
    conteudo.scrollHeight;
  }

  /* ATUALIZAÇÃO DO CHAT */

function iniciarAtualizacaoChat() {

  pararAtualizacaoChat();

  intervaloChat =
    setInterval(
      buscarMensagensChat,
      3000
    );
}

function pararAtualizacaoChat() {

  if (intervaloChat) {

    clearInterval(intervaloChat);

    intervaloChat = null;
  }
}


/* ENVIAR MENSAGEM */

async function enviarMensagemChat() {

  const input =
    document.getElementById("mensagemInput");

  const texto =
    input.value.trim();

  if (!texto) {
    return;
  }

  if (!conversaUsuarioId) {

    alert("Nenhuma conversa selecionada.");

    return;
  }

  const { error } =
    await supabaseClient
      .from("mensagens")
      .insert({
        remetente_id: usuario.id,
        destinatario_id: conversaUsuarioId,
        mensagem: texto,
        lida: false
      });

  if (error) {

    alert(error.message);

    return;
  }

  input.value = "";

  await buscarMensagensChat();
}


/* ENTER PARA ENVIAR */

document
  .getElementById("mensagemInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        enviarMensagemChat();
      }
    }
  );

  /* LISTAR CONVERSAS */

async function listarConversas() {

  pararAtualizacaoChat();

  mostrarTela("listaConversas");

  const conteudo =
    document.getElementById("conversasConteudo");

  conteudo.innerHTML =
    "Carregando mensagens...";

  const { data, error } =
    await supabaseClient
      .from("mensagens")
      .select("*")
      .or(
        `remetente_id.eq.${usuario.id},destinatario_id.eq.${usuario.id}`
      )
      .order("created_at", {
        ascending: false
      });

  if (error) {

    conteudo.innerHTML = `
      <div class="erro">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {

    conteudo.innerHTML = `
      <div class="sem-mensagem">
        Você ainda não possui mensagens.
      </div>
    `;

    return;
  }

  const usuariosConversas =
    new Map();

  data.forEach(msg => {

    const outroUsuario =
      msg.remetente_id === usuario.id
        ? msg.destinatario_id
        : msg.remetente_id;

    if (
      outroUsuario !== usuario.id &&
      !usuariosConversas.has(outroUsuario)
    ) {

      usuariosConversas.set(
        outroUsuario,
        msg
      );
    }
  });

  const ids =
    Array.from(
      usuariosConversas.keys()
    );

  if (ids.length === 0) {

    conteudo.innerHTML = `
      <div class="sem-mensagem">
        Você ainda não possui mensagens.
      </div>
    `;

    return;
  }

  const { data: perfis } =
    await supabaseClient
      .from("profiles")
      .select("id,nome")
      .in("id", ids);

  const nomes =
    new Map();

  (perfis || []).forEach(perfil => {

    nomes.set(
      perfil.id,
      perfil.nome
    );
  });

  conteudo.innerHTML = "";

  usuariosConversas.forEach(
    (msg, outroUsuarioId) => {

      const div =
        document.createElement("div");

      div.className = "conversa";

      const nome =
        nomes.get(outroUsuarioId) ||
        "Usuário";

      div.innerHTML = `
        <strong>
          💬 ${escapeHtml(nome)}
        </strong>

        <p>
          ${escapeHtml(msg.mensagem)}
        </p>

        <small>
          Toque para abrir a conversa
        </small>
      `;

      div.onclick = () =>
        abrirConversa(outroUsuarioId);

      conteudo.appendChild(div);
    }
  );
  }

  /* VERIFICAR SESSÃO */

async function verificarSessao() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    usuario = data.session.user;

    await carregarPainel();

  } else {

    mostrar("inicio");
  }
}
