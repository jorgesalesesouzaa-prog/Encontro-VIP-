<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encontro VIP</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1, h2 {
  text-align: center;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: none;
  border-radius: 8px;
  background: #111;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.btn-secundario {
  background: #777;
}

.btn-verde {
  background: #16823b;
}

.btn-vermelho {
  background: #b3261e;
}

.btn-roxo {
  background: #6a1b9a;
}

.hidden {
  display: none;
}

.anuncio {
  border: 1px solid #ddd;
  padding: 15px;
  margin: 12px 0;
  border-radius: 10px;
  background: #fff;
}

.anuncio img {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 10px;
}

.mensagem {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  background: #f0f0f0;
}

.mensagem.nao-lida {
  border-left: 5px solid #6a1b9a;
  background: #f3e5f5;
}

.pequeno {
  color: #666;
  font-size: 14px;
}

.sucesso {
  color: green;
  font-weight: bold;
}

.erro {
  color: red;
  font-weight: bold;
}

.menu {
  margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="container">

<!-- INÍCIO -->
<div id="inicio">
  <div class="card">
    <h1>Encontro VIP</h1>
    <p style="text-align:center;">Conecte-se de forma simples e segura.</p>

    <button onclick="mostrar('cadastro')">Criar conta</button>
    <button onclick="mostrar('login')" class="btn-secundario">Entrar</button>
  </div>
</div>


<!-- CADASTRO -->
<div id="cadastro" class="hidden">
  <div class="card">
    <h2>Criar conta</h2>

    <input id="cadNome" type="text" placeholder="Nome">
    <input id="cadTelefone" type="text" placeholder="Telefone">
    <input id="cadEmail" type="email" placeholder="E-mail">
    <input id="cadSenha" type="password" placeholder="Senha">

    <button onclick="cadastrar()">Criar conta</button>
    <button onclick="mostrar('inicio')" class="btn-secundario">Voltar</button>

    <p id="cadMensagem"></p>
  </div>
</div>


<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="card">
    <h2>Entrar</h2>

    <input id="loginEmail" type="email" placeholder="E-mail">
    <input id="loginSenha" type="password" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>
    <button onclick="mostrar('inicio')" class="btn-secundario">Voltar</button>

    <p id="loginMensagem"></p>
  </div>
</div>


<!-- PAINEL -->
<div id="painel" class="hidden">
  <div class="card">
    <h2>Encontro VIP</h2>

    <p id="olaUsuario"></p>

    <div class="menu">
      <button onclick="mostrar('criarAnuncio')">
        Criar meu anúncio
      </button>

      <button onclick="listarAnuncios()">
        Ver anúncios
      </button>

      <button onclick="listarFavoritos()">
        Meus favoritos
      </button>

      <button onclick="listarMensagens()" class="btn-roxo">
        Minhas mensagens
      </button>

      <button onclick="sair()" class="btn-vermelho">
        Sair
      </button>
    </div>
  </div>
</div>


<!-- CRIAR ANÚNCIO -->
<div id="criarAnuncio" class="hidden">
  <div class="card">
    <h2>Criar meu anúncio</h2>

    <input id="anNome" type="text" placeholder="Nome">
    <input id="anIdade" type="number" placeholder="Idade">
    <input id="anCidade" type="text" placeholder="Cidade">

    <textarea id="anDescricao" placeholder="Descrição"></textarea>

    <input id="anFoto" type="url" placeholder="URL da foto">

    <button onclick="criarAnuncio()" class="btn-verde">
      Publicar anúncio
    </button>

    <button onclick="mostrar('painel')" class="btn-secundario">
      Voltar
    </button>

    <p id="anMensagem"></p>
  </div>
</div>


<!-- LISTA DE ANÚNCIOS -->
<div id="listaAnuncios" class="hidden">
  <div class="card">
    <h2>Anúncios</h2>

    <div id="conteudoAnuncios"></div>

    <button onclick="mostrar('painel')" class="btn-secundario">
      Voltar
    </button>
  </div>
</div>


<!-- FAVORITOS -->
<div id="listaFavoritos" class="hidden">
  <div class="card">
    <h2>Meus favoritos</h2>

    <div id="conteudoFavoritos"></div>

    <button onclick="mostrar('painel')" class="btn-secundario">
      Voltar
    </button>
  </div>
</div>


<!-- MENSAGENS -->
<div id="listaMensagens" class="hidden">
  <div class="card">
    <h2>Minhas mensagens</h2>

    <div id="conteudoMensagens"></div>

    <button onclick="mostrar('painel')" class="btn-secundario">
      Voltar
    </button>
  </div>
</div>


<!-- ENVIAR MENSAGEM -->
<div id="enviarMensagem" class="hidden">
  <div class="card">

    <h2>Enviar mensagem</h2>

    <p id="destinatarioNome"></p>

    <textarea
      id="textoMensagem"
      placeholder="Digite sua mensagem..."
    ></textarea>

    <button onclick="enviarMensagem()" class="btn-verde">
      Enviar mensagem
    </button>

    <button onclick="mostrar('listaAnuncios')" class="btn-secundario">
      Voltar
    </button>

    <p id="mensagemEnvio"></p>

  </div>
</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://avgnulmolujgedfdjdhb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Q_IvM4UGgiB4qZGzSXEuig_uP9oda_f";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuario = null;
let destinatarioId = null;
let destinatarioNomeAtual = "";


/* =========================
   MOSTRAR TELA
========================= */

function mostrar(tela) {

  const telas = [
    "inicio",
    "cadastro",
    "login",
    "painel",
    "criarAnuncio",
    "listaAnuncios",
    "listaFavoritos",
    "listaMensagens",
    "enviarMensagem"
  ];

  telas.forEach(id => {

    const elemento = document.getElementById(id);

    if (elemento) {
      elemento.classList.add("hidden");
    }

  });

  const escolhida = document.getElementById(tela);

  if (escolhida) {
    escolhida.classList.remove("hidden");
  }
}


/* =========================
   CADASTRO
========================= */

async function cadastrar() {

  const nome =
    document.getElementById("cadNome").value.trim();

  const telefone =
    document.getElementById("cadTelefone").value.trim();

  const email =
    document.getElementById("cadEmail").value.trim();

  const senha =
    document.getElementById("cadSenha").value;

  const mensagem =
    document.getElementById("cadMensagem");


  mensagem.textContent = "";


  if (!nome || !email || !senha) {

    mensagem.textContent =
      "Preencha nome, e-mail e senha.";

    mensagem.className = "erro";

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password: senha
    });


  if (error) {

    mensagem.textContent =
      error.message;

    mensagem.className = "erro";

    return;
  }


  if (!data.user) {

    mensagem.textContent =
      "Conta criada. Verifique seu e-mail para continuar.";

    mensagem.className = "sucesso";

    return;
  }


  const { error: erroPerfil } =
    await supabaseClient
      .from("profiles")
      .insert({
        id: data.user.id,
        nome: nome,
        telefone: telefone,
        tipo: "usuario",
        ativo: true
      });


  if (erroPerfil) {

    mensagem.textContent =
      "Conta criada, mas houve um problema ao salvar o perfil: " +
      erroPerfil.message;

    mensagem.className = "erro";

    return;
  }


  mensagem.textContent =
    "Cadastro criado com sucesso!";

  mensagem.className = "sucesso";


  setTimeout(() => {

    mostrar("login");

  }, 1000);
}


/* =========================
   LOGIN
========================= */

async function entrar() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const senha =
    document.getElementById("loginSenha").value;

  const mensagem =
    document.getElementById("loginMensagem");


  mensagem.textContent = "";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password: senha
    });


  if (error) {

    mensagem.textContent =
      error.message;

    mensagem.className = "erro";

    return;
  }


  usuario = data.user;


  await carregarPainel();
}


/* =========================
   CARREGAR PAINEL
========================= */

async function carregarPainel() {

  if (!usuario) {
    return;
  }


  const { data: perfil } =
    await supabaseClient
      .from("profiles")
      .select("nome")
      .eq("id", usuario.id)
      .maybeSingle();


  let nome = "usuário";


  if (perfil && perfil.nome) {
    nome = perfil.nome;
  }


  document.getElementById("olaUsuario").textContent =
    "Olá, " + nome + "!";


  mostrar("painel");
}


/* =========================
   SAIR
========================= */

async function sair() {

  await supabaseClient.auth.signOut();

  usuario = null;

  mostrar("inicio");
}


/* =========================
   CRIAR ANÚNCIO
========================= */

async function criarAnuncio() {

  if (!usuario) {

    alert("Faça login primeiro.");

    return;
  }


  const nome =
    document.getElementById("anNome").value.trim();

  const idade =
    document.getElementById("anIdade").value;

  const cidade =
    document.getElementById("anCidade").value.trim();

  const descricao =
    document.getElementById("anDescricao").value.trim();

  const foto =
    document.getElementById("anFoto").value.trim();

  const mensagem =
    document.getElementById("anMensagem");


  mensagem.textContent = "";


  if (!nome || !idade || !cidade || !descricao) {

    mensagem.textContent =
      "Preencha todos os campos obrigatórios.";

    mensagem.className = "erro";

    return;
  }


  const { error } =
    await supabaseClient
      .from("anuncios")
      .insert({
        usuario_id: usuario.id,
        nome: nome,
        idade: Number(idade),
        cidade: cidade,
        descricao: descricao,
        foto_url: foto || null,
        ativo: true
      });


  if (error) {

    mensagem.textContent =
      error.message;

    mensagem.className = "erro";

    return;
  }


  mensagem.textContent =
    "Anúncio publicado com sucesso!";

  mensagem.className = "sucesso";


  document.getElementById("anNome").value = "";
  document.getElementById("anIdade").value = "";
  document.getElementById("anCidade").value = "";
  document.getElementById("anDescricao").value = "";
  document.getElementById("anFoto").value = "";
}


/* =========================
   LISTAR ANÚNCIOS
========================= */

async function listarAnuncios() {

  mostrar("listaAnuncios");


  const conteudo =
    document.getElementById("conteudoAnuncios");


  conteudo.innerHTML =
    "<p>Carregando anúncios...</p>";


  const { data, error } =
    await supabaseClient
      .from("anuncios")
      .select(`
        id,
        usuario_id,
        nome,
        idade,
        cidade,
        descricao,
        foto_url
      `)
      .eq("ativo", true)
      .order("created_at", {
        ascending: false
      });


  if (error) {

    conteudo.innerHTML =
      `<p class="erro">${error.message}</p>`;

    return;
  }


  if (!data || data.length === 0) {

    conteudo.innerHTML =
      "<p>Nenhum anúncio encontrado.</p>";

    return;
  }


  conteudo.innerHTML = "";


  data.forEach(anuncio => {

    let fotoHtml = "";

    if (anuncio.foto_url) {

      fotoHtml = `
        <img
          src="${anuncio.foto_url}"
          alt="Foto de ${anuncio.nome}"
        >
      `;
    }


    const div =
      document.createElement("div");

    div.className = "anuncio";


    div.innerHTML = `
      ${fotoHtml}

      <h3>
        ${anuncio.nome}, ${anuncio.idade}
      </h3>

      <p>
        <strong>Cidade:</strong>
        ${anuncio.cidade}
      </p>

      <p>
        ${anuncio.descricao}
      </p>

      <button
        onclick="favoritarAnuncio('${anuncio.id}')"
        class="btn-secundario"
      >
        ❤️ Favoritar
      </button>

      <button
        onclick="abrirEnviarMensagem(
          '${anuncio.usuario_id}',
          '${escapeHtml(anuncio.nome)}'
        )"
        class="btn-roxo"
      >
        💬 Enviar mensagem
      </button>
    `;


    conteudo.appendChild(div);

  });
}


/* =========================
   ESCAPAR TEXTO
========================= */

function escapeHtml(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   FAVORITAR
========================= */

async function favoritarAnuncio(anuncioId) {

  if (!usuario) {

    alert("Faça login primeiro.");

    return;
  }


  const { error } =
    await supabaseClient
      .from("favoritos")
      .insert({
        usuario_id: usuario.id,
        anuncio_id: anuncioId
      });


  if (error) {

    if (error.code === "23505") {

      alert("Este anúncio já está nos seus favoritos.");

      return;
    }


    alert(
      "Erro ao favoritar: " +
      error.message
    );

    return;
  }


  alert("Anúncio adicionado aos favoritos!");
}


/* =========================
   LISTAR FAVORITOS
========================= */

async function listarFavoritos() {

  mostrar("listaFavoritos");


  const conteudo =
    document.getElementById("conteudoFavoritos");


  conteudo.innerHTML =
    "<p>Carregando favoritos...</p>";


  const { data, error } =
    await supabaseClient
      .from("favoritos")
      .select(`
        id,
        anuncio_id,
        anuncios (
          id,
          nome,
          idade,
          cidade,
          descricao,
          foto_url
        )
      `)
      .eq("usuario_id", usuario.id)
      .order("created_at", {
        ascending: false
      });


  if (error) {

    conteudo.innerHTML =
      `<p class="erro">${error.message}</p>`;

    return;
  }


  if (!data || data.length === 0) {

    conteudo.innerHTML =
      "<p>Você ainda não tem favoritos.</p>";

    return;
  }


  conteudo.innerHTML = "";


  data.forEach(item => {

    if (!item.anuncios) {
      return;
    }


    const anuncio =
      item.anuncios;


    const div =
      document.createElement("div");

    div.className = "anuncio";


    let fotoHtml = "";

    if (anuncio.foto_url) {

      fotoHtml = `
        <img
          src="${anuncio.foto_url}"
          alt="Foto de ${anuncio.nome}"
        >
      `;
    }


    div.innerHTML = `
      ${fotoHtml}

      <h3>
        ${anuncio.nome}, ${anuncio.idade}
      </h3>

      <p>
        <strong>Cidade:</strong>
        ${anuncio.cidade}
      </p>

      <p>
        ${anuncio.descricao}
      </p>
    `;


    conteudo.appendChild(div);

  });
}


/* =========================
   ABRIR ENVIO DE MENSAGEM
========================= */

function abrirEnviarMensagem(id, nome) {

  if (!usuario) {

    alert("Faça login primeiro.");

    return;
  }


  if (id === usuario.id) {

    alert("Você não pode enviar mensagem para você mesmo.");

    return;
  }


  destinatarioId = id;

  destinatarioNomeAtual = nome;


  document.getElementById("destinatarioNome").innerHTML =
    "<strong>Para: " + nome + "</strong>";


  document.getElementById("textoMensagem").value = "";

  document.getElementById("mensagemEnvio").textContent = "";


  mostrar("enviarMensagem");
}


/* =========================
   ENVIAR MENSAGEM
========================= */

async function enviarMensagem() {

  if (!usuario) {

    alert("Faça login primeiro.");

    return;
  }


  if (!destinatarioId) {

    alert("Destinatário não encontrado.");

    return;
  }


  const texto =
    document.getElementById("textoMensagem")
      .value
      .trim();

  const mensagem =
    document.getElementById("mensagemEnvio");


  if (!texto) {

    mensagem.textContent =
      "Digite uma mensagem.";

    mensagem.className = "erro";

    return;
  }


  const { error } =
    await supabaseClient
      .from("mensagens")
      .insert({
        remetente_id: usuario.id,
        destinatario_id: destinatarioId,
        mensagem: texto,
        lida: false
      });


  if (error) {

    mensagem.textContent =
      "Erro ao enviar: " +
      error.message;

    mensagem.className = "erro";

    return;
  }


  mensagem.textContent =
    "Mensagem enviada com sucesso!";

  mensagem.className = "sucesso";


  document.getElementById("textoMensagem").value = "";


  setTimeout(() => {

    listarMensagens();

  }, 800);
}


/* =========================
   LISTAR MENSAGENS
========================= */

async function listarMensagens() {

  mostrar("listaMensagens");


  const conteudo =
    document.getElementById("conteudoMensagens");


  conteudo.innerHTML =
    "<p>Carregando mensagens...</p>";


  const { data, error } =
    await supabaseClient
      .from("mensagens")
      .select(`
        id,
        remetente_id,
        destinatario_id,
        mensagem,
        lida,
        created_at
      `)
      .or(
        `remetente_id.eq.${usuario.id},destinatario_id.eq.${usuario.id}`
      )
      .order("created_at", {
        ascending: false
      });


  if (error) {

    conteudo.innerHTML =
      `<p class="erro">${error.message}</p>`;

    return;
  }


  if (!data || data.length === 0) {

    conteudo.innerHTML =
      "<p>Você ainda não possui mensagens.</p>";

    return;
  }


  conteudo.innerHTML = "";


  for (const item of data) {

    const div =
      document.createElement("div");

    div.className =
      "mensagem" +
      (!item.lida &&
       item.destinatario_id === usuario.id
        ? " nao-lida"
        : "");


    let tipo = "";


    if (item.remetente_id === usuario.id) {
      tipo = "Você enviou";
    } else {
      tipo = "Mensagem recebida";
    }


    const dataMensagem =
      new Date(item.created_at)
        .toLocaleString("pt-BR");


    div.innerHTML = `
      <strong>${tipo}</strong>

      <p>${escapeHtml(item.mensagem)}</p>

      <span class="pequeno">
        ${dataMensagem}
      </span>
    `;


    conteudo.appendChild(div);


    if (
      item.destinatario_id === usuario.id &&
      item.lida === false
    ) {

      await marcarComoLida(item.id);

    }
  }
}


/* =========================
   MARCAR COMO LIDA
========================= */

async function marcarComoLida(id) {

  await supabaseClient
    .from("mensagens")
    .update({
      lida: true
    })
    .eq("id", id)
    .eq("destinatario_id", usuario.id);
}


/* =========================
   VERIFICAR SESSÃO
========================= */

async function verificarSessao() {

  const { data } =
    await supabaseClient.auth.getSession();


  if (data.session) {

    usuario = data.session.user;

    await carregarPainel();

  } else {

    mostrar("inicio");

  }
}


verificarSessao();

</script>

</body>
</html>
