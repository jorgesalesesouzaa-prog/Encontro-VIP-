<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encontro VIP</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px 30px;
    }

    h1 {
      color: #d4af37;
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #ddd;
      font-size: 18px;
    }

    .botao {
      display: inline-block;
      margin: 15px 8px;
      padding: 15px 30px;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .botao.secundario {
      background: transparent;
      color: #d4af37;
      border: 1px solid #d4af37;
    }

    .card {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: #1c1c1c;
      border-radius: 15px;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Encontro VIP</h1>
    <p>Conectando pessoas de forma simples, segura e discreta.</p>

    <a href="#" class="botao">Criar conta</a>
    <a href="#" class="botao secundario">Entrar</a>
  </header>

  <div class="card">
    <h2>Encontre seu encontro</h2>
    <p>
      Crie seu perfil, conheça anúncios e envie solicitações de contato.
    </p>
  </div>

  <footer>
    © 2026 Encontro VIP
  </footer>

</body>
  </html>
